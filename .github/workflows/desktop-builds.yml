name: Build Desktop Releases (Windows, macOS, Linux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows Build (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load Version Properties
        shell: bash
        run: |
          grep -v '^#' version.properties | grep '=' >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env File from Secrets
        shell: bash
        run: |
          touch .env
          echo "GROQ_KEY=${{ secrets.GROQ_KEY }}" >> .env
          echo "GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }}" >> .env
          echo "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> .env

      - name: Build Windows Release
        shell: powershell
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release --no-tree-shake-icons --build-name=${{ env.VERSION_NAME }} --build-number=${{ env.VERSION_CODE }} --dart-define=GROQ_KEY=${{ secrets.GROQ_KEY }} --dart-define=GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }} --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}

      - name: Package Windows Bundle (.zip)
        shell: powershell
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Aura_Music_Windows_x64.zip

      - name: Upload Windows Bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || 'v4.0.0' }}
          name: ${{ env.RELEASE_NAME || 'Aura Music Release' }}
          files: Aura_Music_Windows_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: 🍎 macOS Build (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load Version Properties
        run: |
          grep -v '^#' version.properties | grep '=' >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env File from Secrets
        run: |
          touch .env
          echo "GROQ_KEY=${{ secrets.GROQ_KEY }}" >> .env
          echo "GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }}" >> .env
          echo "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> .env

      - name: Build macOS Release
        run: |
          flutter build macos --release --no-tree-shake-icons --build-name=${{ env.VERSION_NAME }} --build-number=${{ env.VERSION_CODE }} --dart-define=GROQ_KEY=${{ secrets.GROQ_KEY }} --dart-define=GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }} --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}

      - name: Package macOS App (.zip)
        run: |
          ditto -c -k --keepParent build/macos/Build/Products/Release/music_app.app Aura_Music_macOS_x64.zip

      - name: Upload macOS Bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || 'v4.0.0' }}
          name: ${{ env.RELEASE_NAME || 'Aura Music Release' }}
          files: Aura_Music_macOS_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: 🐧 Linux Build (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load Version Properties
        run: |
          grep -v '^#' version.properties | grep '=' >> $GITHUB_ENV

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libstdc++6

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env File from Secrets
        run: |
          touch .env
          echo "GROQ_KEY=${{ secrets.GROQ_KEY }}" >> .env
          echo "GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }}" >> .env
          echo "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> .env

      - name: Build Linux Release
        run: |
          flutter build linux --release --no-tree-shake-icons --build-name=${{ env.VERSION_NAME }} --build-number=${{ env.VERSION_CODE }} --dart-define=GROQ_KEY=${{ secrets.GROQ_KEY }} --dart-define=GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }} --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}

      - name: Package Linux Bundle (.tar.gz)
        run: |
          tar -czvf Aura_Music_Linux_x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || 'v4.0.0' }}
          name: ${{ env.RELEASE_NAME || 'Aura Music Release' }}
          files: Aura_Music_Linux_x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
