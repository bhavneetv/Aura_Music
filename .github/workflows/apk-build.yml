name: Build Flutter APK & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Load Version Properties
        run: |
          grep -v '^#' version.properties | grep '=' >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env File from Secrets
        run: |
          touch .env
          echo "GROQ_KEY=${{ secrets.GROQ_KEY }}" >> .env
          echo "GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }}" >> .env
          echo "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> .env

      - name: Restore Firebase Android Config
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_SECRET" ]; then
            echo "Decoding google-services.json from secret..."
            python3 -c "import base64, os; open('android/app/google-services.json', 'wb').write(base64.b64decode(os.environ['FIREBASE_SECRET'].strip()))"
            echo "Firebase Android config restored successfully from secret."
          else
            echo "::warning::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 secret not found! Writing fallback config so Android build succeeds."
            cat << 'EOF' > android/app/google-services.json
{
  "project_info": {
    "project_number": "99053788865",
    "firebase_url": "https://aura-c0ef9-default-rtdb.asia-southeast1.firebasedatabase.app",
    "project_id": "aura-c0ef9",
    "storage_bucket": "aura-c0ef9.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:99053788865:android:c037a580f2acd5ea16be40",
        "android_client_info": {
          "package_name": "com.example.music_app"
        }
      },
      "oauth_client": [
        {
          "client_id": "99053788865-oij6ue1m50finaf1nmuni0hsl6naa13j.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.example.music_app",
            "certificate_hash": "765340f62eb57fb2c83d9b5d373971b49a251f0c"
          }
        },
        {
          "client_id": "99053788865-89nobspq91is6u3b6rghlrm6t53omhpf.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyBfiieR2gKzNBgRYawZsaaAtB3-vMy2cy0"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "99053788865-89nobspq91is6u3b6rghlrm6t53omhpf.apps.googleusercontent.com",
              "client_type": 3
            },
            {
              "client_id": "99053788865-j1anpma0qnk4p9opab4v25dgpn3j3u68.apps.googleusercontent.com",
              "client_type": 2,
              "ios_info": {
                "bundle_id": "com.example.musicApp"
              }
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi
          ls -lh android/app/google-services.json



      - name: Setup Android Release Keystore
        run: |
          KEY_B64="${{ secrets.KEYSTORE_BASE64 }}"
          STORE_PASS="${{ secrets.ANDROID_STORE_PASSWORD }}"
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"

          if [ -n "$KEY_B64" ] && [ -n "$STORE_PASS" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEY_B64" | tr -d '\r\n ' | base64 --decode > android/aura-release-key.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../aura-release-key.jks\n" "$STORE_PASS" "${KEY_PASS:-$STORE_PASS}" "${KEY_ALIAS:-aura}" > android/key.properties
            echo "Release keystore configured successfully."
          else
            echo "No KEYSTORE_BASE64 or ANDROID_STORE_PASSWORD secret found. Building with debug signing fallback."
            rm -f android/key.properties android/aura-release-key.jks
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation --build-name=${{ env.VERSION_NAME }} --build-number=${{ env.VERSION_CODE }} --dart-define=GROQ_KEY=${{ secrets.GROQ_KEY }} --dart-define=GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }} --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}

      - name: Verify APK
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
