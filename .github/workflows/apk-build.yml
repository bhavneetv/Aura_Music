name: Build Flutter APK & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Load Version Properties
        run: |
          grep -v '^#' version.properties | grep '=' >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env File from Secrets
        run: |
          touch .env
          echo "GROQ_KEY=${{ secrets.GROQ_KEY }}" >> .env
          echo "GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }}" >> .env
          echo "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> .env

      - name: Restore Firebase Android Config
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          FALLBACK_B64=""
          export B64_DATA="${FIREBASE_SECRET:-$FALLBACK_B64}"
          python3 -c "import base64, os; open('android/app/google-services.json', 'wb').write(base64.b64decode(os.environ.get('B64_DATA', '').strip()))"
          ls -lh android/app/google-services.json



      - name: Setup Android Release Keystore
        run: |
          KEY_B64="${{ secrets.KEYSTORE_BASE64 }}"
          STORE_PASS="${{ secrets.ANDROID_STORE_PASSWORD }}"
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"

          if [ -n "$KEY_B64" ] && [ -n "$STORE_PASS" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEY_B64" | tr -d '\r\n ' | base64 --decode > android/aura-release-key.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../aura-release-key.jks\n" "$STORE_PASS" "${KEY_PASS:-$STORE_PASS}" "${KEY_ALIAS:-aura}" > android/key.properties
            echo "Release keystore configured successfully."
          else
            echo "No KEYSTORE_BASE64 or ANDROID_STORE_PASSWORD secret found. Building with debug signing fallback."
            rm -f android/key.properties android/aura-release-key.jks
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation --build-name=${{ env.VERSION_NAME }} --build-number=${{ env.VERSION_CODE }} --dart-define=GROQ_KEY=${{ secrets.GROQ_KEY }} --dart-define=GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }} --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}

      - name: Verify APK
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
