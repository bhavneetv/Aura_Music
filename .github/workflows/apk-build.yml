name: Build Flutter APK & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Load Version Properties
        run: |
          grep -v '^#' version.properties | grep '=' >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env File from Secrets
        run: |
          touch .env
          echo "GROQ_KEY=${{ secrets.GROQ_KEY }}" >> .env
          echo "GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }}" >> .env
          echo "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> .env

      - name: Restore Firebase Android Config
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          FALLBACK_B64=""
          export B64_DATA="${FIREBASE_SECRET:-$FALLBACK_B64}"
          python3 -c "import base64, os; open('android/app/google-services.json', 'wb').write(base64.b64decode(os.environ.get('B64_DATA', '').strip()))"
          ls -lh android/app/google-services.json



      - name: Setup Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - << 'EOF'
          import base64, os, sys, subprocess

          FALLBACK_KEY_B64 = ""

          raw_secret = os.environ.get("KEYSTORE_BASE64", "").strip()
          store_pass = os.environ.get("ANDROID_STORE_PASSWORD", "").strip() or "BHanu505verma"
          key_pass = os.environ.get("ANDROID_KEY_PASSWORD", "").strip() or store_pass
          key_alias = os.environ.get("ANDROID_KEY_ALIAS", "").strip() or "aura"

          use_fallback = True
          os.makedirs("android", exist_ok=True)
          target_path = "android/aura-release-key.jks"

          if raw_secret and raw_secret != "?" and len(raw_secret) > 100:
              try:
                  secret_bytes = base64.b64decode(raw_secret)
                  with open(target_path, "wb") as f:
                      f.write(secret_bytes)
                  res = subprocess.run(
                      ["keytool", "-list", "-keystore", target_path, "-storepass", store_pass, "-alias", key_alias],
                      capture_output=True, text=True
                  )
                  if res.returncode == 0:
                      print("Custom KEYSTORE_BASE64 verified successfully with keytool.")
                      use_fallback = False
                  else:
                      print(f"Custom KEYSTORE_BASE64 failed verification ({res.stderr.strip()}), falling back to canonical keystore.")
              except Exception as e:
                  print(f"Exception decoding KEYSTORE_BASE64 ({e}), falling back to canonical keystore.")

          if use_fallback:
              print("Writing verified canonical Aura release keystore...")
              with open(target_path, "wb") as f:
                  f.write(base64.b64decode(FALLBACK_KEY_B64))
              store_pass = "BHanu505verma"
              key_pass = "BHanu505verma"
              key_alias = "aura"

          with open("android/key.properties", "w", encoding="utf-8") as f:
              f.write(f"storePassword={store_pass}\n")
              f.write(f"keyPassword={key_pass}\n")
              f.write(f"keyAlias={key_alias}\n")
              f.write("storeFile=../aura-release-key.jks\n")

          print("Keystore and android/key.properties configured successfully.")
          EOF

      - name: Verify Keystore Certificate Fingerprint
        run: |
          echo "Verifying release keystore with keytool..."
          keytool -list -v -keystore android/aura-release-key.jks -storepass BHanu505verma -alias aura > keystore_info.txt
          cat keystore_info.txt
          grep -i "76:53:40:F6:2E:B5:7F:B2:C8:3D:9B:5D:37:39:71:B4:9A:25:1F:0C" keystore_info.txt || {
            echo "ERROR: Release keystore certificate does NOT match Aura release certificate!"
            exit 1
          }
          echo "Verified: Keystore certificate matches canonical Aura release certificate."

      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation \
            --build-name=${{ env.VERSION_NAME }} \
            --build-number=${{ env.VERSION_CODE }} \
            --dart-define=GROQ_KEY=${{ secrets.GROQ_KEY }} \
            --dart-define=GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }} \
            --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}

      - name: Verify Built APK Signing Certificate
        run: |
          ls -lh build/app/outputs/flutter-apk/
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          $APKSIGNER verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > apk_cert_info.txt
          cat apk_cert_info.txt
          grep -i "765340f62eb57fb2c83d9b5d373971b49a251f0c" apk_cert_info.txt || \
          grep -i "76:53:40:F6:2E:B5:7F:B2:C8:3D:9B:5D:37:39:71:B4:9A:25:1F:0C" apk_cert_info.txt || \
          grep -i "ce503272528843d6054c0288a3269e13de2bbac2ee98af1fc6e38a740f2c4367" apk_cert_info.txt || {
            echo "CRITICAL ERROR: Release APK was NOT signed with the Aura release certificate!"
            exit 1
          }
          echo "SUCCESS: Release APK signature confirmed identical to Aura release certificate."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
