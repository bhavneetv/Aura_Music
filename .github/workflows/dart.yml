name: iOS-ipa-build-new

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load Version Properties
        run: |
          grep -v '^#' version.properties | grep '=' >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Dependencies
        run: flutter pub get

      - name: Create .env File from Secrets
        run: |
          touch .env
          echo "GROQ_KEY=${{ secrets.GROQ_KEY }}" >> .env
          echo "GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }}" >> .env
          echo "GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> .env
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'aura' }}" >> .env
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || '?' }}" >> .env
          echo "ANDROID_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD || '?' }}" >> .env
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'aura' }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || '?' }}" >> $GITHUB_ENV
          echo "ANDROID_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD || '?' }}" >> $GITHUB_ENV

      - name: Restore Firebase iOS Config
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$FIREBASE_SECRET" ]; then
            echo "Decoding GoogleService-Info.plist from secret..."
            python3 -c "import base64, os; open('ios/Runner/GoogleService-Info.plist', 'wb').write(base64.b64decode(os.environ['FIREBASE_SECRET'].strip()))"
            echo "Firebase iOS config restored successfully from secret."
          else
            echo "::warning::FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64 secret not found! Writing fallback config so Xcode build succeeds."
            cat << 'EOF' > ios/Runner/GoogleService-Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>CLIENT_ID</key>
	<string>99053788865-j1anpma0qnk4p9opab4v25dgpn3j3u68.apps.googleusercontent.com</string>
	<key>REVERSED_CLIENT_ID</key>
	<string>com.googleusercontent.apps.99053788865-j1anpma0qnk4p9opab4v25dgpn3j3u68</string>
	<key>ANDROID_CLIENT_ID</key>
	<string>99053788865-oij6ue1m50finaf1nmuni0hsl6naa13j.apps.googleusercontent.com</string>
	<key>API_KEY</key>
	<string>AIzaSyC9ih5L_PbZ5AdBOcf0aiy_XKlaHE9Aj74</string>
	<key>GCM_SENDER_ID</key>
	<string>99053788865</string>
	<key>PLIST_VERSION</key>
	<string>1</string>
	<key>BUNDLE_ID</key>
	<string>com.example.musicApp</string>
	<key>PROJECT_ID</key>
	<string>aura-c0ef9</string>
	<key>STORAGE_BUCKET</key>
	<string>aura-c0ef9.firebasestorage.app</string>
	<key>IS_ADS_ENABLED</key>
	<false></false>
	<key>IS_ANALYTICS_ENABLED</key>
	<false></false>
	<key>IS_APPINVITE_ENABLED</key>
	<true></true>
	<key>IS_GCM_ENABLED</key>
	<true></true>
	<key>IS_SIGNIN_ENABLED</key>
	<true></true>
	<key>GOOGLE_APP_ID</key>
	<string>1:99053788865:ios:151da9fc6808874316be40</string>
	<key>DATABASE_URL</key>
	<string>https://aura-c0ef9-default-rtdb.asia-southeast1.firebasedatabase.app</string>
</dict>
</plist>
EOF
          fi
          ls -lh ios/Runner/GoogleService-Info.plist

      - name: Build iOS Release App (Unsigned)
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons \
            --build-name=${{ env.VERSION_NAME }} \
            --build-number=${{ env.VERSION_CODE }} \
            --dart-define=GROQ_KEY=${{ secrets.GROQ_KEY }} \
            --dart-define=GROQ_KEY_2=${{ secrets.GROQ_KEY_2 }} \
            --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}

      - name: Package IPA from Runner.app
        run: |
          mkdir -p Payload
          cp -RL "build/ios/iphoneos/Runner.app" Payload/
          echo "--- Payload size after copy ---"
          du -sh Payload
          ditto -c -k --keepParent Payload FlutterIpaExport.ipa
          echo "--- Final IPA size ---"
          ls -lh FlutterIpaExport.ipa

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: FlutterIpaExport.ipa
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
          body: "${{ env.RELEASE_TAG }} iOS release build"
